properties:
  systemBucket:
    description: |
      Встроенное системное объектное хранилище: `ObjectStore` типа `System`
      (Garage на control-plane узлах) и бакет `system` для нужд платформы.
      Работает в трёх репликах с фактором репликации 3 независимо от числа
      control-plane узлов, если параметр `singleReplica` не сводит его к одной
      реплике.
    properties:
      enabled:
        description: |
          Разворачивать ли системный `ObjectStore` и его бакет `system`.
          Отключите, если встроенное объектное хранилище платформе не нужно.
      singleReplica:
        description: |
          Запускать системный `ObjectStore` в одной реплике Garage
          (`replication_factor: 1`) вместо трёх по умолчанию.

          Реплика размещается на одном control-plane узле и **никогда не
          переезжает между мастерами**: её данные лежат на локальном томе этого
          узла, а дореплицироваться не с чего — второй копии нет. Если узел
          выведен или недоступен, системное хранилище недоступно до его
          возвращения (данные на его диске не затрагиваются), и контроллер не
          будет переносить реплику.

          Режим нужен, чтобы уменьшить потребление ресурсов системным хранилищем
          на небольших и непродуктивных инсталляциях. Не используйте его там, где
          данные платформы в бакете `system` должны переживать потерю
          control-plane узла.

          > **Включение и выключение параметра пересоздаёт системный
          > `ObjectStore` и УНИЧТОЖАЕТ все хранящиеся в нём данные.** Garage не
          > умеет менять фактор репликации на живом кластере, поэтому контроллер
          > сносит data plane (StatefulSet, тома, идентичности нод) и поднимает
          > его пустым на новых каталогах — в обе стороны (и при включении, и при
          > выключении). Бакеты создаются заново, ключи доступа перевыпускаются
          > автоматически, но объекты теряются: сохраните нужные данные заранее.
          > Каталоги предыдущего кластера остаются на control-plane узлах в
          > `/var/lib/deckhouse/sds-object/garage/system` и могут быть удалены
          > вручную, когда перестанут быть нужны.
  logLevel:
    description: Уровень логирования модуля.
