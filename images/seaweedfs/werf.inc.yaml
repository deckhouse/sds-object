{{- /*
  SeaweedFS server image.

  The `weed` binary is built from upstream source with the standard container-base
  Go toolchain, then copied into the module's distroless base — same layout as the
  module's own Go images (controller/webhooks/go-hooks).

  The version is taken from oss.yaml (id: seaweedfs); keep it in sync with
  seaweedfsVersion in images/controller/internal/backend/seaweedfs.
*/ -}}
{{- $seaweedfsVersion := include "get_oss_version_by_id" (list "seaweedfs" $) }}
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/src" }}
final: false

git:
  - add: {{ .ModuleDir }}
    to: /patches
    includePaths:
      - images/{{ $.ImageName }}/patches
    stageDependencies:
      install:
        - '**/*'

secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}

shell:
  install:
    - git clone --depth 1 --branch {{ $seaweedfsVersion }} $(cat /run/secrets/SOURCE_REPO)/seaweedfs/seaweedfs.git /src
    - cd /src
    # Apply any CVE/build patches. As of SeaweedFS 4.39 the upstream go.mod
    # already pins the previously-vulnerable transitive deps at patched versions,
    # so there is no patch to apply; the loop tolerates an empty patch set.
    - for patchfile in /patches/images/{{ $.ImageName }}/patches/*.patch; do [ -e "${patchfile}" ] || continue; echo "Apply ${patchfile} ..."; git apply ${patchfile} --verbose; done
    - rm -rf /src/.git

---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-golang-artifact
from: {{ index $.Images (eq .SVACE_ENABLED "false" | ternary "builder/golang" "builder/alpine-svace") }}
final: false

import:
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
    add: /src
    to: /src
    before: install

mount:
{{ include "mount points for golang builds" . }}

secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}

shell:
  setup:
    - cd /src/weed
    # CVE bumps for transitive dependencies upstream still pins at vulnerable
    # versions: golang.org/x/text CVE-2026-56852 (norm.Iter infinite loop, fixed
    # in 0.39.0) and google.golang.org/grpc GHSA-hrxh-6v49-42gf (xDS RBAC and
    # HTTP/2, fixed in 1.82.1). Done with `go get` rather than a patch file: a
    # patch would have to carry go.sum hashes and would break on every SeaweedFS
    # bump, while this reapplies itself. Drop the lines once upstream's go.mod
    # pins these versions or newer.
    - >
      GOPROXY=$(cat /run/secrets/GOPROXY) go get
      golang.org/x/text@v0.39.0
      google.golang.org/grpc@v1.82.1
    - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
    - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
    - |
      {{- include "image-build.build" (set $ "BuildCommand" `go build -ldflags="-s -w" -o /weed .`) | nindent 6 }}
    - chmod +x /weed

---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}
from: {{ index $.Images "builder/distroless" }}

import:
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-golang-artifact
    add: /weed
    to: /weed
    before: setup
git:
{{- include "image mount points" . }}

imageSpec:
  config:
    entrypoint: ["/weed"]
    env:
      SEAWEEDFS_VERSION: "{{ $seaweedfsVersion }}"

{{- /*
Attach an OpenVEX attestation to the seaweedfs image so trivy suppresses the
unfixable golang.org/x/crypto/openpgp advisory (GO-2026-5932) reported against
the upstream `weed` binary. Predicate:
/images/seaweedfs/known_vulnerabilities.vex (per the "vex mitigation" template).
*/ -}}
{{- include "vex mitigation" (list $ $.ImageName) }}
